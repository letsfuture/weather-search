<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 날씨</title>
<style>
  :root {
    --grad: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    --glass: rgba(255, 255, 255, 0.16);
    --glass-border: rgba(255, 255, 255, 0.3);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.78);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--grad);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* 배경 장식 블롭 */
  .blob {
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    z-index: -1;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob.a { background: #ffd6e8; top: -120px; left: -120px; }
  .blob.b { background: #7dd3fc; bottom: -140px; right: -100px; animation-delay: -5s; }

  @keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.1); }
  }

  .card {
    width: 100%;
    max-width: 380px;
    padding: 32px 26px 26px;
    border-radius: 28px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(30, 20, 70, 0.25);
    text-align: center;
    animation: rise 0.6s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .date { font-size: 14px; color: var(--muted); letter-spacing: 0.02em; }

  .place {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    font-size: 14px;
    font-weight: 600;
  }

  .notice {
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
  }

  .main { margin: 26px 0 22px; }
  .icon { font-size: 84px; line-height: 1; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15)); }
  .temp {
    margin-top: 8px;
    font-size: 88px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.04em;
  }
  .temp span { font-size: 40px; vertical-align: top; margin-left: 4px; opacity: 0.9; }
  .desc { margin-top: 8px; font-size: 18px; font-weight: 500; }
  .range { margin-top: 6px; font-size: 14px; color: var(--muted); }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat {
    padding: 14px 6px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.18);
  }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { margin-top: 6px; font-size: 16px; font-weight: 600; }

  button {
    margin-top: 22px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: #ffffff;
    color: #5b4bb5;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.2); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.6; cursor: default; transform: none; }

  .loading { padding: 60px 0; }
  .spinner {
    width: 44px;
    height: 44px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, 0.3);
    border-top-color: #ffffff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: var(--muted); font-size: 15px; }

  .error { padding: 30px 0 10px; }
  .error p { color: var(--muted); font-size: 15px; line-height: 1.6; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .blob, .card, .spinner { animation: none; }
  }
</style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>

  <main class="card">
    <div class="date" id="date"></div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>위치를 확인하고 있어요…</p>
    </div>

    <div id="error" class="error" hidden>
      <p>날씨 정보를 불러오지 못했어요.<br>잠시 후 다시 시도해 주세요.</p>
    </div>

    <section id="weather" hidden>
      <div class="place">📍 <span id="place"></span></div>
      <div class="notice" id="notice" hidden></div>

      <div class="main">
        <div class="icon" id="icon"></div>
        <div class="temp"><span id="temp"></span><span>°</span></div>
        <div class="desc" id="desc"></div>
        <div class="range">
          최고 <span id="max"></span>° · 최저 <span id="min"></span>°
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="label">체감</div>
          <div class="value" id="feels"></div>
        </div>
        <div class="stat">
          <div class="label">습도</div>
          <div class="value" id="humidity"></div>
        </div>
        <div class="stat">
          <div class="label">강수확률</div>
          <div class="value" id="precip"></div>
        </div>
      </div>
    </section>

    <button id="refresh" type="button">다시 조회</button>
  </main>

<script>
  const SEOUL = { latitude: 37.5665, longitude: 126.978 };

  // WMO 날씨 코드 → [설명, 아이콘]
  const WMO = {
    0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["구름 조금", "⛅"], 3: ["흐림", "☁️"],
    45: ["안개", "🌫️"], 48: ["안개", "🌫️"],
    51: ["이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["이슬비", "🌦️"],
    56: ["진눈깨비", "🌨️"], 57: ["진눈깨비", "🌨️"],
    61: ["비", "🌧️"], 63: ["비", "🌧️"], 65: ["폭우", "🌧️"],
    66: ["진눈깨비", "🌨️"], 67: ["진눈깨비", "🌨️"],
    71: ["눈", "❄️"], 73: ["눈", "❄️"], 75: ["폭설", "❄️"], 77: ["싸락눈", "🌨️"],
    80: ["소나기", "🌦️"], 81: ["소나기", "🌧️"], 82: ["폭우", "⛈️"],
    85: ["눈 소나기", "🌨️"], 86: ["눈 소나기", "🌨️"],
    95: ["뇌우", "⛈️"], 96: ["우박 동반 뇌우", "⛈️"], 99: ["우박 동반 뇌우", "⛈️"],
  };

  const $ = (id) => document.getElementById(id);

  function showState(state) {
    $("loading").hidden = state !== "loading";
    $("error").hidden = state !== "error";
    $("weather").hidden = state !== "weather";
    $("refresh").disabled = state === "loading";
  }

  // 현재 위치 (실패 시 reject → 서울로 대체)
  function getPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error("unsupported"));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
        reject,
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 10 * 60 * 1000 }
      );
    });
  }

  // 좌표 → 지역 이름 (실패 시 기본값)
  async function getPlaceName(lat, lon) {
    try {
      const res = await fetch(
        `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`
      );
      const data = await res.json();
      const parts = [data.principalSubdivision, data.locality || data.city].filter(Boolean);
      const unique = parts.filter((v, i) => parts.indexOf(v) === i);
      return unique.join(" ") || "현재 위치";
    } catch {
      return "현재 위치";
    }
  }

  // 오늘 날씨 (Open-Meteo, API 키 불필요)
  async function fetchWeather(lat, lon) {
    const params = new URLSearchParams({
      latitude: lat,
      longitude: lon,
      current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code",
      daily: "temperature_2m_max,temperature_2m_min,precipitation_probability_max",
      timezone: "auto",
      forecast_days: "1",
    });
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
    if (!res.ok) throw new Error("weather request failed");
    return res.json();
  }

  function render(data, place, fallback) {
    const cur = data.current;
    const daily = data.daily;
    const [desc, icon] = WMO[cur.weather_code] || ["알 수 없음", "🌡️"];

    const today = new Date().toLocaleDateString("ko-KR", {
      year: "numeric", month: "long", day: "numeric", weekday: "long",
    });
    $("date").textContent = today;

    $("place").textContent = place;
    $("notice").hidden = !fallback;
    $("notice").textContent = "위치를 찾을 수 없어 서울 날씨를 보여드려요.";

    $("icon").textContent = icon;
    $("temp").textContent = Math.round(cur.temperature_2m);
    $("desc").textContent = desc;
    $("max").textContent = Math.round(daily.temperature_2m_max[0]);
    $("min").textContent = Math.round(daily.temperature_2m_min[0]);

    $("feels").textContent = `${Math.round(cur.apparent_temperature)}°`;
    $("humidity").textContent = `${cur.relative_humidity_2m}%`;
    $("precip").textContent = `${daily.precipitation_probability_max[0] ?? 0}%`;

    showState("weather");
  }

  async function load() {
    showState("loading");

    let loc = null;
    let fallback = false;
    try {
      loc = await getPosition();
    } catch {
      loc = SEOUL;
      fallback = true;
    }

    try {
      const [data, place] = await Promise.all([
        fetchWeather(loc.latitude, loc.longitude),
        fallback ? Promise.resolve("서울") : getPlaceName(loc.latitude, loc.longitude),
      ]);
      render(data, place, fallback);
    } catch {
      showState("error");
    }
  }

  $("refresh").addEventListener("click", load);
  load();
</script>
</body>
</html>
